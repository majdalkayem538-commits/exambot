services:
  - type: worker
    name: exam-bot
    runtime: python
    plan: 0.5c-512mb
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    disk:
      name: exam-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DB_PATH
        value: /var/data/exam_bot.db
      - key: SUBJECT_1_NAME
        value: التحليل الكلي
      - key: SUBJECT_1_TEACHER
        value: سمارا
      - key: SUBJECT_2_NAME
        value: الرياضيات الاقتصادية
      - key: SUBJECT_2_TEACHER
        value: زينب
      - key: BOT_TOKEN
        sync: false
      - key: SUBJECT_1_ADMIN_ID
        sync: false
      - key: SUBJECT_2_ADMIN_ID
        sync: false
